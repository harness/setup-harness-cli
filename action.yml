name: 'Setup Harness CLI'
description: 'Install and authenticate the Harness CLI with the Artifact Registry (har) plugin so you can push and manage artifacts in subsequent steps.'

branding:
  icon: 'package'
  color: 'blue'

inputs:
  api-url:
    description: 'Harness API base URL (e.g. https://app.harness.io). No trailing slash. Can also be set via the HARNESS_URL environment variable.'
    required: false
  account:
    description: 'Harness account ID. Can also be set via the HARNESS_ACCOUNT_ID environment variable.'
    required: false
  token:
    description: 'Harness PAT token. Always pass via a secret. Can also be set via the HARNESS_PAT_TOKEN environment variable.'
    required: false
  org:
    description: 'Harness organization ID (required). Can also be set via the HARNESS_ORG_ID environment variable.'
    required: false
  project:
    description: 'Harness project ID (required). Can also be set via the HARNESS_PROJECT_ID environment variable.'
    required: false
  cli-version:
    description: 'Harness CLI release tag to install from harness/cli (e.g. v3.12.0). Defaults to latest.'
    required: false
    default: 'latest'
  github-token:
    description: 'Token used to call the GitHub API when resolving the latest Harness CLI release. Defaults to the workflow token.'
    required: false
    default: ${{ github.token }}

outputs:
  cli-version:
    description: 'The resolved Harness CLI version that was installed (e.g. v3.12.0).'

runs:
  using: 'node24'
  main: 'dist/index.js'
  post: 'dist/cleanup.js'
  post-if: always()
